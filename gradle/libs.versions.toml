[versions]
# core
alloy = "0.1.0"
exposed = "1.+"
lodestone = "0.3-SNAPSHOT"
luckperms = "5.+"
packetevents = "2.13.+"
slf4j = "2.0.+"

# bukkit
spigot = "26.3-R0.1-SNAPSHOT"
xseries = "14.0.+"
placeholderapi = "2.+"
bstats = "3.+"

# mod
minecraft = "26.3"

# fabric
fabric-api = "0.160.5+26.3"
fabric-loader = "0.19.3"
fabric-loom = "1.18-SNAPSHOT"

# neoforge
neoforge = "26.3.0.6-beta"
neoforge-moddev = "2.+"

[libraries]
# core
alloy = { module = "cat.freya:alloy", version.ref = "alloy" }
exposed-core = { module = "org.jetbrains.exposed:exposed-core", version.ref = "exposed" }
exposed-jdbc = { module = "org.jetbrains.exposed:exposed-jdbc", version.ref = "exposed" }
luckperms-api = { module = "net.luckperms:api", version.ref = "luckperms" }
packetevents-api = { module = "com.github.retrooper:packetevents-api", version.ref = "packetevents" }
packetevents-spigot = { module = "com.github.retrooper:packetevents-spigot", version.ref = "packetevents" }
slf4j-api = { module = "org.slf4j:slf4j-api", version.ref = "slf4j" }

# bukkit
spigot-api = { module = "org.spigotmc:spigot-api", version.ref = "spigot" }
xseries = { module = "com.github.cryptomorin:XSeries", version.ref = "xseries" }
placeholderapi = { module = "me.clip:placeholderapi", version.ref = "placeholderapi" }
bstats-bukkit = { module = "org.bstats:bstats-bukkit", version.ref = "bstats" }

# mod
minecraft = { module = "com.mojang:minecraft", version.ref = "minecraft" }

# fabric
fabric-api = { module = "net.fabricmc.fabric-api:fabric-api", version.ref = "fabric-api" }
fabric-loader = { module = "net.fabricmc:fabric-loader", version.ref = "fabric-loader" }

# neoforge
neoforge = { module = "net.neoforged:neoforge", version.ref = "neoforge" }

[plugins]
fabric-loom = { id = "net.fabricmc.fabric-loom", version.ref = "fabric-loom" }
lodestone = { id = "cat.freya.lodestone", version.ref = "lodestone" }
neoforge-moddev = { id = "net.neoforged.moddev", version.ref = "neoforge-moddev" }
