[versions]
# core
alloy = "0.1.1"
exposed = "1.+"
lodestone = "0.1.1"
luckperms = "5.+"
packetevents = "2.13.+"
slf4j = "2.0.+"

# bukkit
spigot = "26.3-R0.1-SNAPSHOT"
xseries = "14.0.+"
placeholderapi = "2.+"
bstats = "3.+"

# mod
minecraft = "26.3"
architectury = "22.+"
architectury-loom = "1.17-SNAPSHOT"
architectury-plugin = "3.5-SNAPSHOT"

# fabric
fabricapi = "0.160.5+26.3"
fabricloader = "0.19.3"

# neoforge
neoforge = "26.3.0.6-beta"

[libraries]
# core
alloy = { module = "cat.freya:alloy", version.ref = "alloy" }
exposed-core = { module = "org.jetbrains.exposed:exposed-core", version.ref = "exposed" }
exposed-jdbc = { module = "org.jetbrains.exposed:exposed-jdbc", version.ref = "exposed" }
luckperms-api = { module = "net.luckperms:api", version.ref = "luckperms" }
packetevents-api = { module = "com.github.retrooper:packetevents-api", version.ref = "packetevents" }
packetevents-spigot = { module = "com.github.retrooper:packetevents-spigot", version.ref = "packetevents" }
slf4j-api = { module = "org.slf4j:slf4j-api", version.ref = "slf4j" }

# bukkit
spigot-api = { module = "org.spigotmc:spigot-api", version.ref = "spigot" }
xseries = { module = "com.github.cryptomorin:XSeries", version.ref = "xseries" }
placeholderapi = { module = "me.clip:placeholderapi", version.ref = "placeholderapi" }
bstats-bukkit = { module = "org.bstats:bstats-bukkit", version.ref = "bstats" }

# mod
minecraft = { module = "com.mojang:minecraft", version.ref = "minecraft" }

# fabric
fabric-loader = { module = "net.fabricmc:fabric-loader", version.ref = "fabricloader" }
fabric-api = { module = "net.fabricmc.fabric-api:fabric-api", version.ref = "fabricapi" }

# neoforge
neoforge = { module = "net.neoforged:neoforge", version.ref = "neoforge" }

[plugins]
architectury-loom = { id = "dev.architectury.loom-no-remap", version.ref = "architectury-loom" }
architectury-plugin = { id = "architectury-plugin", version.ref = "architectury-plugin" }
lodestone = { id = "cat.freya.lodestone", version.ref = "lodestone" }
