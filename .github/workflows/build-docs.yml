name: "Build"
"on":
  pull_request:
    branches:
      - "main"
jobs:
  docs:
    runs-on: "ubuntu-latest"
    steps:
      - name: "SCM"
        uses: "actions/checkout@v7"
      - name: "Setup mdBook"
        uses: "peaceiris/actions-mdbook@v2"
        with:
          mdbook-version: "latest"
      - run: "mdbook build docs"
