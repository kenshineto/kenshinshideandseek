name: "Lint"
"on":
  pull_request:
    branches:
      - "main"
  push:
    branches:
      - "main"
jobs:
  lint:
    runs-on: "ubuntu-latest"
    steps:
      - name: "SCM"
        uses: "actions/checkout@v7"
      - name: "Setup JDK25"
        uses: "actions/setup-java@v6"
        with:
          java-version: 25
          distribution: "temurin"
      - name: "Setup Gradle"
        uses: "gradle/actions/setup-gradle@v6"
      - name: "Lint"
        run: "./gradlew check"
