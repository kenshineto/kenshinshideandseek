name: "Build"
"on":
  pull_request:
    branches:
      - "main"
  push:
    branches:
      - "main"
jobs:
  build:
    runs-on: "ubuntu-latest"
    strategy:
      matrix:
        platform:
          - "bukkit"
          - "fabric"
          - "neoforge"
    steps:
      - name: "SCM"
        uses: "actions/checkout@v7"
      - name: "Setup JDK8"
        uses: "actions/setup-java@v6"
        with:
          java-version: 8
          distribution: "temurin"
      - name: "Setup JDK25"
        uses: "actions/setup-java@v6"
        with:
          java-version: 25
          distribution: "temurin"
      - name: "Setup Gradle"
        uses: "gradle/actions/setup-gradle@v6"
        with:
          add-job-summary: "never"
      - name: "Build"
        run: "./gradlew :${{ matrix.platform }}:build"
      - name: "Artifacts"
        uses: "actions/upload-artifact@v7"
        with:
          path: "${{ matrix.platform }}/build/libs/*+${{ matrix.platform }}.jar"
          archive: false
